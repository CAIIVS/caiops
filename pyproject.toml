[project]
name = "caiops"
version = "0.1.0"
description = "Latent Indi"
readme = "README.md"
authors = [
    {name = "Martin Oswald", email = "martin.oswald@zhaw.ch"},
    {name = "Daniel Barco", email = "daniel.barco@zhaw.ch"},
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.6.0",
    "chuchichaestli>=0.2.7",
    "datasets>=3.5.0",
    "hydra-core>=1.3.2",
    "tensorboard>=2.19.0",
    "timm>=1.0.15",
    "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
caiops = "caiops.main:main"
